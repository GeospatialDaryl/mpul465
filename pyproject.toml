[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mpul465"
version = "0.1.0"
description = "Python interface for the SII MPU-L465 thermal printer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "Pillow>=10",
]

[project.optional-dependencies]
svg = ["CairoSVG>=2.7"]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
mpul465 = "mpul465.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
